services:
  app_training:
    container_name: app_training
    build:
      context: .
      target: dev
    volumes:
      - .env:/app/.env
      - ./private_key.pem:/app/private_key.pem
      - ./public_key.pem:/app/public_key.pem
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: unless-stopped
    networks:
      - app_training_mariadb_training_network
    depends_on:
      mariadb_training:
        condition: service_healthy

  mariadb_training:
    container_name: mariadb_training
    image: mariadb:11
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 1
      MARIADB_USER: "${DATABASE_USERNAME}"
      MARIADB_PASSWORD: "${DATABASE_PASSWORD}"
      MARIADB_DATABASE: "${DATABASE_NAME}"
    volumes:
      - mariadb_training_data:/var/lib/mysql
    networks:
      - mariadb_training_phpmyadmin_training_network
      - app_training_mariadb_training_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 3s
      retries: 15

  phpmyadmin_training:
    container_name: phpmyadmin_training
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mariadb_training
      PMA_USER: "${DATABASE_USERNAME}"
      PMA_PASSWORD: "${DATABASE_PASSWORD}"
    depends_on:
      - mariadb_training
    ports:
      - "8082:80"
    networks:
      - mariadb_training_phpmyadmin_training_network
    restart: unless-stopped

volumes:
  mariadb_training_data:

networks:
  mariadb_training_phpmyadmin_training_network:
  app_training_mariadb_training_network:
