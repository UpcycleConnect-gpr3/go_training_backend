services:
  app_training:
    build:
      context: .
      target: dev
    container_name: app_training
    volumes:
      - ./.env:/app/.env
      - ./private_key.pem:/app/private_key.pem
      - ./public_key.pem:/app/public_key.pem
    depends_on:
      mariadb_training:
        condition: service_healthy
    restart: on-failure
    networks:
      - default
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app_training.rule=Host(`training.localhost`)"
      - "traefik.http.services.app_training.loadbalancer.server.port=8083"

  mariadb_training:
    image: mariadb:11
    container_name: mariadb_training
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 1
      MARIADB_USER: gouser
      MARIADB_PASSWORD: password
      MARIADB_DATABASE: go_training
    ports:
      - '3308:3306'
    volumes:
      - mariadb_training_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin_training:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_training
    environment:
      PMA_HOST: mariadb_training
      PMA_USER: gouser
      PMA_PASSWORD: password
    depends_on:
      - mariadb_training
    networks:
      - default
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma_training.rule=Host(`pma-training.localhost`)"
      - "traefik.http.services.pma_training.loadbalancer.server.port=80"

volumes:
  mariadb_training_data:

networks:
  traefik_network:
    external: true
